# compose.yaml · Todos los contenedores de la sede, en un solo fichero.
# Se lanza desde la raíz del repositorio. instalar.sh lo hace por fases.
# Es el ÚNICO compose del proyecto: no debe haber otros en web/ ni dns/.

# Ajustes que comparten todos los servicios (se reutilizan con "<<: *comun")
x-comun: &comun
  restart: unless-stopped
  logging:                         # sin esto los logs crecen sin límite y llenan el disco de la VM
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:

  # ============================================================ web · IAW
  web:
    <<: *comun
    build: ./web
    container_name: mi-apache
    ports:
      - "80:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # El fichero lo genera instalar.sh a partir de .env (no va en Git)
      - ./secretos/intranet.htpasswd:/etc/apache2/.htpasswd:ro
    environment:                    # nombres que lee el PHP con getenv()
      DB_HOST: db
      DB_NAME: ${DB_NAME:?falta DB_NAME en .env}
      DB_USER: ${DB_USER:?falta DB_USER en .env}
      DB_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en .env}
    networks: [frontal, trasera]
    depends_on:
      db:
        condition: service_healthy
      git:
        condition: service_started

  # ============================================================ db · ASGBD
  db:
    <<: *comun
    image: postgres:16
    container_name: mi-postgres
    ports:
      - "5432:5432"                 # Expone PostgreSQL para clientes externos (ASGBD)
    environment:
      # Administrador de la base: dueño de las tablas, NO lo usa la web
      POSTGRES_DB: ${DB_NAME:?falta DB_NAME en .env}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
      # Usuario de la web (lo crea db/03_usuario_web.sh: leer, insertar y editar, pero no borrar)
      DB_USER: ${DB_USER:?falta DB_USER en .env}
      DB_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en .env}
    volumes:
      - datos:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
      - ./db/conf/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./db/conf/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf -c hba_file=/etc/postgresql/pg_hba.conf
    networks: [trasera]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
      start_period: 10s

  # ============================================================ git · Optativo
  git:
    <<: *comun
    image: codeberg.org/forgejo/forgejo:1.21
    container_name: forgejo
    environment:
      - USER_UID=1000
      - USER_GID=1000
      # Los datos de la sede salen de sede.env (instalar.sh exporta DOMINIO); mandan sobre el app.ini restaurado
      - GITEA__server__DOMAIN=git.${DOMINIO:-huesca.empresa.lan}
      - GITEA__server__SSH_DOMAIN=git.${DOMINIO:-huesca.empresa.lan}
      - GITEA__server__ROOT_URL=http://git.${DOMINIO:-huesca.empresa.lan}/
      - GITEA__server__SSH_PORT=2222          # puerto que ven los clientes (el de la URL de clonado)
      - GITEA__server__SSH_LISTEN_PORT=22     # puerto de sshd dentro del contenedor
      # Por defecto bloqueado; instalar.sh lo pone a false solo si aún no existe la base de datos
      - GITEA__security__INSTALL_LOCK=${FORGEJO_INSTALL_LOCK:-true}
      - FORGEJO__security__INSTALL_LOCK=${FORGEJO_INSTALL_LOCK:-true}
      - GITEA__service__DISABLE_REGISTRATION=true                     # nadie se crea cuenta solo (F2)
    ports:
      - "127.0.0.1:3000:3000"       # solo local: a la web se llega por Apache (git.<dominio>) y instalar.sh la comprueba en 127.0.0.1
      - "2222:22"                   # SSH para clonar: este sí tiene que verse desde fuera
    volumes:
      - ./forgejo-docker:/data
    # frontal es necesaria: en una red "internal" Docker NO publica los puertos
    networks: [frontal, trasera]

  # ============================================================ dns · SRI
  dns:
    <<: *comun
    image: internetsystemsconsortium/bind9:9.18
    container_name: mi-bind9
    network_mode: host              # escucha en la IP del aula, puerto 53
    volumes:
      - ./generado/dns:/etc/bind:ro   # lo genera instalar.sh dns a partir de dns/*.tpl y sede.env
    command: ["-g", "-c", "/etc/bind/named.conf", "-u", "bind"]

  # ============================================================ ldap · SRI
  ldap:
    <<: *comun
    image: osixia/openldap:1.5.0
    container_name: ldap
    # --copy-service: imprescindible porque ./ldif se monta en solo lectura (:ro).
    # Sin esto la imagen intenta hacer chown sobre los .ldif, falla y reinicia en bucle.
    command: --copy-service
    environment:
      LDAP_ORGANISATION: "Sede Huesca"
      LDAP_DOMAIN: "huesca.empresa.lan"
      LDAP_ADMIN_PASSWORD: "${LDAP_ADMIN_PASSWORD:?falta LDAP_ADMIN_PASSWORD en .env}"
      LDAP_CONFIG_PASSWORD: "${LDAP_CONFIG_PASSWORD:?falta LDAP_CONFIG_PASSWORD en .env}"
    ports:
      - "389:389"
      - "636:636"
    volumes:
      # Los .ldif de esta carpeta se cargan solos SOLO la primera vez (con la base de datos vacía)
      - ./ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom:ro
      - datos_ldap_db:/var/lib/ldap
      - datos_ldap_config:/etc/ldap/slapd.d
    networks: [frontal, trasera]
    healthcheck:                    # así lam espera a que LDAP responda de verdad (y no solo a que el contenedor exista)
      test: ["CMD-SHELL", "ldapwhoami -x -H ldap://localhost -D cn=admin,dc=huesca,dc=empresa,dc=lan -w \"$$LDAP_ADMIN_PASSWORD\" >/dev/null"]
      interval: 5s
      retries: 12
      start_period: 30s

  # ============================================================ lam · SRI
  lam:
    <<: *comun
    image: ldapaccountmanager/lam:stable
    container_name: lam
    ports:
      - "8080:80"
    environment:
      LAM_PASSWORD: "${LAM_PASSWORD:?falta LAM_PASSWORD en .env}"
      LDAP_SERVER: "ldap://ldap:389"
      LDAP_DOMAIN: "huesca.empresa.lan"
      LDAP_BASE_DN: "dc=huesca,dc=empresa,dc=lan"
      LDAP_USER: "cn=admin,dc=huesca,dc=empresa,dc=lan"
      LDAP_USERS_DN: "ou=investigadores,dc=huesca,dc=empresa,dc=lan"
      LDAP_GROUPS_DN: "ou=grupos,dc=huesca,dc=empresa,dc=lan"
    networks: [frontal, trasera]
    depends_on:
      ldap:
        condition: service_healthy

volumes:
  datos:
  datos_ldap_db:
  datos_ldap_config:

networks:
  frontal:
  trasera:
    internal: true