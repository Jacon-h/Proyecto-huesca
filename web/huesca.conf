# 1. Sitio Web Público
<VirtualHost *:80>
    ServerName www.huesca.empresa.lan
    DocumentRoot /var/www/html/www

    <Directory /var/www/html/www>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/www_error.log
    CustomLog ${APACHE_LOG_DIR}/www_access.log combined
</VirtualHost>

# 2. Sitio Web Intranet (Autenticado)
<VirtualHost *:80>
    ServerName intranet.huesca.empresa.lan
    DocumentRoot /var/www/html/intranet

    <Directory /var/www/html/intranet>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        AuthType Basic
        AuthName "Acceso Restringido - Intranet Huesca"
        AuthUserFile /etc/apache2/.htpasswd
        Require valid-user
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/intranet_error.log
    CustomLog ${APACHE_LOG_DIR}/intranet_access.log combined
</VirtualHost>

# 3. Git (Forgejo): proxy al contenedor "forgejo" (compose.yaml), puerto 3000
<VirtualHost *:80>
    ServerName git.huesca.empresa.lan

    ProxyPreserveHost On
    ProxyPass / http://forgejo:3000/
    ProxyPassReverse / http://forgejo:3000/

    ErrorLog ${APACHE_LOG_DIR}/git_error.log
    CustomLog ${APACHE_LOG_DIR}/git_access.log combined
</VirtualHost>

# 4. GNS3: proxy al gns3server que corre en el servidor (puerto 3080, escucha en 0.0.0.0).
#    host.docker.internal lo define compose.yaml (extra_hosts). La interfaz web usa websockets.
<VirtualHost *:80>
    ServerName gns3.huesca.empresa.lan

    ProxyPreserveHost On
    ProxyPass / http://host.docker.internal:3080/ upgrade=websocket
    ProxyPassReverse / http://host.docker.internal:3080/

    ErrorLog ${APACHE_LOG_DIR}/gns3_error.log
    CustomLog ${APACHE_LOG_DIR}/gns3_access.log combined
</VirtualHost>
